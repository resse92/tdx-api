services:
  tdx-api:
    build:
      context: .
    image: tdx-api:local
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: :8080
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
