schema: spec-driven

context: |
  项目：tdx-api，一个基于 github.com/bensema/gotdx 的无状态股票行情 HTTP API 服务。
  语言：Go 1.26 或更高版本。
  HTTP 框架：Gin。
  API 风格：统一使用 /api/v1 下的 RESTful JSON 接口，原始市场文件不对外暴露。
  架构：
  - cmd/api 负责进程启动、信号处理和依赖装配。
  - internal/config 负责基于环境变量的配置加载与启动校验。
  - internal/httpapi 负责 Gin 路由、处理器、中间件、DTO、参数校验和响应格式化。
  - internal/tdx 负责沪深市场 gotdx 适配器、连接生命周期、并发隔离、重试和主机故障转移。
  开发约定：
  - 所有 OpenSpec 规划产物和项目说明文档均使用简体中文，代码标识符、命令、路径、协议字段及无法准确翻译的专有名词除外。
  - 使用 gofmt，并遵循 Go 惯用的命名和包设计规范。
  - HTTP 处理器保持精简，通过小型接口调用上游编排逻辑。
  - 在上游支持的范围内，通过 context.Context 传递请求级上下文。
  - 显式返回错误并补充有用上下文；可预期的失败不得使用 panic。
  - 使用统一的 JSON 成功或错误响应结构，以及稳定、可供程序识别的错误码。
  - 所有外部输入必须在调用 gotdx 前完成校验并执行数量及大小限制。
  - 默认允许所有来源跨域但不允许携带凭据，同时支持通过环境变量配置来源白名单。
  - 提供存活检查、就绪检查和自动生成的 OpenAPI 文档。
  - 稳定 API 只允许深圳 market=0 和上海 market=1，不包含北京、香港、美国、扩展市场、Goods、ICFQS 以及实验性或兼容性协议。
  测试约定：
  - 单元测试优先采用表驱动测试，处理器和中间件使用 httptest 测试。
  - 单元测试通过接口和 fake 隔离上游；真实 TDX 请求必须放在显式启用的集成测试中。
  - 执行 go test ./...、go test -race ./...、go vet ./... 和 OpenSpec 严格校验。
  部署约定：
  - 使用固定版本的多阶段 Dockerfile 构建镜像。
  - 最终容器使用非 root 用户运行，并通过环境变量配置。
  - Docker Compose 健康检查和停止宽限期必须与应用就绪检查及优雅关闭保持一致。

rules:
  proposal:
    - proposal.md 必须使用简体中文编写，代码标识符、命令、路径和专有名词可以保留英文。
    - 保持提案简洁，描述可观察的范围，不展开实现细节。
    - 使用 kebab-case 名称明确列出新增和修改的能力。
    - 明确说明变更是否影响公共 API 兼容性、gotdx 能力覆盖、CORS 或部署方式。
  specs:
    - 所有 spec.md 必须使用简体中文编写，Requirement 和 Scenario 的标题内容也必须使用中文。
    - 使用 SHALL 或 MUST 定义外部可观察行为，并提供可测试的 WHEN/THEN 场景。
    - 在相关情况下明确 HTTP 输入、输出、状态码、校验边界和上游失败行为。
    - 将 /api/v1 作为稳定路由前缀，并明确标识任何破坏性 API 变更。
    - 不得暴露任意 gotdx 方法调用或未记录的实验性协议。
  design:
    - design.md 必须使用简体中文编写，代码标识符、命令、路径和专有名词可以保留英文。
    - 在受影响时说明包边界、依赖方向、gotdx 连接所有权、并发控制、故障处理和优雅关闭。
    - 对新增依赖或架构决策记录备选方案及选择理由。
    - 在相关情况下说明 OpenAPI 覆盖、CORS 安全、请求边界和容器运行方式。
  tasks:
    - tasks.md 的分组标题和任务描述必须全部使用简体中文，代码标识符、命令和路径可以保留英文。
    - 按依赖顺序使用编号章节和复选框任务。
    - 在同一任务组中包含实现工作及其对应测试。
    - 在适用时包含格式化、vet、单元测试、竞态测试、OpenSpec 严格校验和容器验证。

operations:
  apply:
    guidance:
      - 实施过程中的任务更新、说明和新增文档均使用简体中文。
      - 按依赖顺序实施任务，并在验证完成后及时更新 tasks.md 复选框。
      - 优先采用最小且正确的变更，并保持设计中定义的包边界。
      - 不得将真实 TDX 网络连通性作为确定性单元测试的前提。
      - 稳定路由或 DTO 发生变化时，重新生成并校验 OpenAPI。
      - 开发期间执行针对性测试，完成后执行变更要求的完整单元测试、竞态测试、vet、OpenSpec 和 Docker 检查。
  archive:
    guidance:
      - 归档说明和最终总结必须使用简体中文。
      - 仅在全部必需任务完成且严格校验通过后归档。
      - 确认公共路由和 OpenAPI 与归档规格一致。
      - 总结已交付的 API 能力、排除的方法类别、验证结果和已知上游限制。
